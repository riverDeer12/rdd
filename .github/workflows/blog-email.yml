# Lets Milan know by e-mail when a new blog article is waiting for review:
# when a pull request from a blog/... branch is opened, this posts a comment
# that mentions him. GitHub e-mails @mentions (Settings > Notifications >
# "Participating, @mentions and custom": Email), and since the comment comes
# from github-actions, not from his own account, the e-mail is sent.

name: Blog e-mail

on:
  pull_request:
    types: [opened, reopened]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  notify:
    if: startsWith(github.head_ref, 'blog/')
    runs-on: ubuntu-latest
    steps:
      - name: Mention the owner on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat > comment.md <<MSG
          @${OWNER} novi članak čeka vaš pregled.

          **Kako objaviti:** otvorite karticu **Files changed** i pročitajte članak, a kad ste zadovoljni kliknite **Merge pull request**. Članak se objavljuje automatski za par minuta.

          Ako nešto treba promijeniti, napišite komentar ovdje ili zatvorite pull request ako članak ne želite objaviti.
          MSG
          gh pr comment "$PR" --body-file comment.md
