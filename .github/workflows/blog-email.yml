# E-mails info@rdd.software when a new blog article is waiting for review,
# i.e. when a pull request from a blog/... branch is opened. Sent through
# FormSubmit, the same service and alias the site's contact form uses.

name: Blog e-mail

on:
  pull_request:
    types: [opened, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test e-mail'
        default: 'yes'

permissions:
  contents: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'blog/')
    runs-on: ubuntu-latest
    steps:
      - name: Send the e-mail
        env:
          TITLE: "${{ github.event.pull_request.title || 'Probna obavijest' }}"
          URL: "${{ github.event.pull_request.html_url || format('{0}/{1}/actions', github.server_url, github.repository) }}"
          BODY: "${{ github.event.pull_request.body || 'Ovo je probna poruka: obavijesti o novim člancima rade.' }}"
        run: |
          python3 - <<'PY' > payload.json
          import json, os
          title = os.environ['TITLE'].removeprefix('Blog: ')
          print(json.dumps({
              '_subject': 'Novi članak čeka pregled: ' + title,
              '_template': 'box',
              '_captcha': 'false',
              'Članak': title,
              'Pregled i objava': os.environ['URL'],
              'Kako objaviti': 'Otvorite link, pročitajte članak u kartici Files changed i kliknite Merge pull request. Članak se objavljuje automatski za par minuta.',
              'Opis': os.environ['BODY'],
          }, ensure_ascii=False))
          PY
          curl --fail-with-body -sS -X POST 'https://formsubmit.co/ajax/202370d6dcbdf3b48b293269997a54ce' \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'Origin: https://rdd.software' -H 'Referer: https://rdd.software/' \
            --data @payload.json
