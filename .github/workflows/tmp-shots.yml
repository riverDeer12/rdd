name: tmp pulseboard shots
on:
  push:
    branches: [tmp/pulseboard-shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p shots
          curl -sL "https://pulseboard.click/icon.svg" -o shots/icon.svg
          curl -sL "https://pulseboard.click/apple-icon.png" -o shots/apple-icon.png
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add shots && git commit -m icons && git push
