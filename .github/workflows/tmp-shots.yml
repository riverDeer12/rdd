name: tmp pulseboard shots
on:
  push:
    branches: [tmp/pulseboard-shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p shots
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const out = {};
            for (const [w,h,tag] of [[1440,900,'desk'],[390,844,'mob']]) {
              const p = await b.newPage({viewport:{width:w,height:h}, deviceScaleFactor: 2});
              const resp = await p.goto('https://pulseboard.click/', {waitUntil:'networkidle', timeout:60000});
              await p.waitForTimeout(2500);
              out[tag] = {status: resp && resp.status(), url: p.url(), title: await p.title()};
              await p.screenshot({path:`shots/${tag}.png`});
              await p.screenshot({path:`shots/${tag}-full.png`, fullPage:true});
              if (tag==='desk') {
                require('fs').writeFileSync('shots/page.html', await p.content());
                require('fs').writeFileSync('shots/text.txt', await p.evaluate(()=>document.body.innerText));
                const links = await p.evaluate(()=>[...document.querySelectorAll('a')].map(a=>a.href));
                out.links = [...new Set(links)];
              }
              await p.close();
            }
            require('fs').writeFileSync('shots/info.json', JSON.stringify(out,null,2));
            await b.close();
          })();
          JS
          node s.js || true
          curl -sL https://pulseboard.click/favicon.ico -o shots/favicon.ico || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add shots && git commit -m shots && git push
