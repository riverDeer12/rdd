# Builds the language versions of the site and sitemap.xml from src/
# whenever src/ or the build tools change on master, and commits the
# result. That way a page can be edited in src/ (also on github.com)
# without running tools/build.py locally.

name: Build pages

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pages and sitemap
        run: python3 tools/build.py

      - name: Check links
        run: python3 tools/check_links.py

      - name: Commit generated files
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build pages from src/" -m "Generated by the Build pages workflow for ${GITHUB_SHA::7}."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # pushes made with GITHUB_TOKEN do not start other workflows,
      # so ask GitHub Pages for a new deployment explicitly
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
